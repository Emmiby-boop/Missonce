<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mini Admin · 编辑资源</title>
<link rel="stylesheet" href="system.css" />
</head>
<body>
<div class="shell">
  <div class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-row">
        <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
        <div><div class="brand-name">Missonce</div><div class="brand-sub">Admin Console</div></div>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-group"><div class="nav-group-label">总览</div>
        <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>仪表盘</div>
        <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>运营分析</div>
      </div>
      <div class="nav-group"><div class="nav-group-label">内容管理</div>
        <div class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>资源管理<span class="badge">2,847</span></div>
        <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>专题管理</div>
        <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><circle cx="7" cy="7" r="1.5"/></svg>分类标签</div>
      </div>
      <div class="nav-group"><div class="nav-group-label">运营</div>
        <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>用户管理</div>
        <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>通知管理<span class="badge">3</span></div>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
        <div class="user-info"><div class="user-name">Admin</div><div class="user-role">超级管理员</div></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;color:var(--tx3);"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>搜索资源、用户、配置...<kbd>⌘K</kbd></div>
      <div class="topbar-spacer"></div>
      <span class="topbar-env">missonce-99</span>
      <div class="topbar-divider"></div>
      <div class="topbar-actions">
        <button class="topbar-btn" title="刷新"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23,4 23,10 17,10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg></button>
        <button class="topbar-btn" title="通知"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg></button>
        <button class="topbar-btn" id="themeBtn" title="切换主题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
      </div>
    </div>

    <div class="content">
      <div class="page-head">
        <div><h1>编辑资源</h1><div class="subtitle">修改素材的元信息、分类与热门数据</div></div>
        <div class="actions"><button class="btn btn-ghost">取消</button><button class="btn btn-pri">保存更改</button></div>
      </div>

      <div class="card" style="max-width:720px;margin:0 auto">
        <div class="card-body" style="display:flex;flex-direction:column;gap:18px">
          <div class="edit-img">封面预览（头像方形 / 壁纸 3:4）</div>

          <div class="field"><span>标题</span><input class="input" value="国风山水壁纸" /></div>

          <div class="form-row">
            <div class="field"><span>类型</span><select class="select"><option>头像</option><option selected>壁纸</option></select></div>
            <div class="field"><span>状态</span><select class="select"><option selected>已发布</option><option>待审</option><option>草稿</option><option>已下线</option></select></div>
          </div>

          <div class="field"><span>分类 <span class="hint">点击下方标签添加</span></span>
            <input class="input" value="壁纸,治愈" />
            <div class="chip-row"><span class="chip add">动态头像</span><span class="chip add">女生</span><span class="chip add">治愈</span><span class="chip add">几何</span><span class="chip add">节日</span></div>
          </div>

          <div class="field"><span>标签（逗号分隔）</span><textarea class="input">治愈,简约,几何</textarea></div>

          <div style="border-top:1px solid var(--bd2);padding-top:18px">
            <p style="font-size:12px;font-weight:600;color:var(--tx3);margin-bottom:12px">热门数据（手动调整）</p>
            <div class="form-row">
              <div class="field"><span>热度值</span><input class="input" value="5000" /></div>
              <div class="field"><span>下载量</span><input class="input" value="1200" /></div>
              <div class="field"><span>浏览量</span><input class="input" value="8800" /></div>
            </div>
            <p style="font-size:11px;color:var(--tx3);margin-top:8px">调整后会直接影响首页热门排行榜数据</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="theme-toggle">
  <button class="theme-btn on" onclick="setTheme('light')">Light</button>
  <button class="theme-btn" onclick="setTheme('dark')">Dark</button>
</div>

<script>
  function setTheme(t){
    document.documentElement.className = t;
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('on', b.textContent.toLowerCase() === t));
  }
  document.getElementById('themeBtn').addEventListener('click', () => setTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark'));
</script>
</body>
</html>
