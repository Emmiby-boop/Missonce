<title>小辣椒后台 · 重设计可交互原型</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&display=swap');

/* ============ 设计令牌（单一来源，消除旧三套冲突） ============ */
:root{
  --primary:#07c160; --primary-hover:#06ad56; --primary-soft:rgba(7,193,96,.12);
  --bg:#f7f7f5; --surface:#ffffff; --surface-2:#fafaf9; --surface-3:#f1f0ee;
  --border:#e7e5e4; --border-strong:#d6d3d1;
  --text:#1c1917; --text-sub:#78716c; --text-mut:#a8a29e;
  --success:#07c160; --warning:#f59e0b; --danger:#ef4444; --info:#3b82f6;
  --success-soft:rgba(7,193,96,.12); --warning-soft:rgba(245,158,11,.14); --danger-soft:rgba(239,68,68,.12); --info-soft:rgba(59,130,246,.12);
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;
  --sh-sm:0 1px 2px rgba(28,25,23,.04),0 1px 3px rgba(28,25,23,.06);
  --sh-md:0 4px 16px rgba(28,25,23,.06),0 2px 6px rgba(28,25,23,.04);
  --sh-lg:0 12px 40px rgba(28,25,23,.10);
  --font-body:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --font-display:'Bricolage Grotesque','Geist',system-ui,sans-serif;
  --sb-w:248px; --sb-w-c:76px; --tb-h:60px;
}
html.dark{
  --bg:#16140e; --surface:#1f1d18; --surface-2:#26231c; --surface-3:#2e2a22;
  --border:#2e2a22; --border-strong:#3a352b;
  --text:#f5f5f4; --text-sub:#a8a29e; --text-mut:#78716c;
  --primary-soft:rgba(7,193,96,.18);
  --sh-sm:0 1px 2px rgba(0,0,0,.3); --sh-md:0 4px 16px rgba(0,0,0,.35); --sh-lg:0 12px 40px rgba(0,0,0,.45);
  --success-soft:rgba(7,193,96,.18); --warning-soft:rgba(245,158,11,.18); --danger-soft:rgba(239,68,68,.18); --info-soft:rgba(59,130,246,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;font-size:14px;line-height:1.5}
.display{font-family:var(--font-display)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}

/* ============ 通用组件 ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:20px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r-sm);font-weight:600;font-size:13px;transition:.15s;border:1px solid transparent}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:var(--surface-2);border-color:var(--border);color:var(--text)}.btn-ghost:hover{background:var(--surface-3)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.badge-g{background:var(--success-soft);color:var(--success)}
.badge-y{background:var(--warning-soft);color:var(--warning)}
.badge-r{background:var(--danger-soft);color:var(--danger)}
.badge-b{background:var(--info-soft);color:var(--info)}
.badge-n{background:var(--surface-3);color:var(--text-sub)}
.input,.select{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 12px;color:var(--text);font-size:13px;outline:none;transition:.15s}
.input:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.switch{width:40px;height:22px;border-radius:999px;background:var(--surface-3);position:relative;transition:.2s;flex:none}
.switch.on{background:var(--primary)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:var(--sh-sm)}
.switch.on::after{transform:translateX(18px)}

/* ============ 登录页 ============ */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(1200px 600px at 80% -10%,var(--primary-soft),transparent),
  radial-gradient(900px 500px at 0% 110%,rgba(59,130,246,.08),transparent),var(--bg)}
.login-card{width:380px;max-width:92vw;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--sh-lg);padding:36px 32px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.brand-logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#0a9c4e);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 18px var(--primary-soft)}
.brand h1{font-family:var(--font-display);font-size:19px;font-weight:800}
.brand p{font-size:12px;color:var(--text-sub)}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-sub);margin-bottom:7px}
.field .input{width:100%}
.login-card .btn-primary{width:100%;justify-content:center;padding:11px;font-size:14px;margin-top:8px}
.hint{font-size:11px;color:var(--text-mut);text-align:center;margin-top:16px}

/* ============ 主框架 ============ */
#app{display:none;height:100vh;overflow:hidden}
#app.show{display:flex}
.sidebar{width:var(--sb-w);flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .25s;overflow:hidden}
#app.collapsed .sidebar{width:var(--sb-w-c)}
.sb-brand{height:var(--tb-h);flex:none;display:flex;align-items:center;gap:11px;padding:0 18px;border-bottom:1px solid var(--border)}
#app.collapsed .sb-brand{padding:0;justify-content:center}
.sb-brand .brand-logo{width:34px;height:34px;border-radius:11px;font-size:17px;flex:none}
.sb-brand .t{font-family:var(--font-display);font-weight:800;font-size:15px;white-space:nowrap}
#app.collapsed .sb-brand .t{display:none}
.sb-nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-group{margin-bottom:6px}
.nav-group .gl{font-size:11px;font-weight:700;color:var(--text-mut);text-transform:uppercase;letter-spacing:.06em;padding:14px 12px 6px;white-space:nowrap}
#app.collapsed .nav-group .gl{opacity:0;height:14px;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-md);color:var(--text-sub);font-weight:500;font-size:13.5px;transition:.13s;white-space:nowrap;width:100%;text-align:left;margin-bottom:2px}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item svg{width:19px;height:19px;flex:none}
#app.collapsed .nav-item{justify-content:center;padding:11px}
#app.collapsed .nav-item .l{display:none}
.sb-foot{padding:12px;border-top:1px solid var(--border)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:var(--tb-h);flex:none;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(10px)}
.topbar .title{font-family:var(--font-display);font-weight:700;font-size:16px}
.topbar .search{flex:1;max-width:340px;margin-left:8px;position:relative}
.topbar .search input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:8px 14px 8px 36px;color:var(--text);outline:none;font-size:13px}
.topbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-mut)}
.icon-btn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--text-sub);transition:.15s;position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn svg{width:19px;height:19px}
.dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
.user-pill{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);margin-left:4px}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
.user-pill .nm{font-size:13px;font-weight:600;line-height:1.1}
.user-pill .rl{font-size:11px;color:var(--text-sub)}

.content{flex:1;overflow-y:auto;padding:24px}
.wrap{max-width:1440px;margin:0 auto}
.view{display:none;animation:fade .3s ease}
.view.show{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h2{font-family:var(--font-display);font-size:22px;font-weight:800}
.page-head p{color:var(--text-sub);font-size:13px;margin-top:3px}

/* 统计卡 */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-sm);position:relative;overflow:hidden}
.stat .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.stat .ic svg{width:20px;height:20px}
.stat .v{font-family:var(--font-display);font-size:26px;font-weight:800;line-height:1}
.stat .l{color:var(--text-sub);font-size:12.5px;margin-top:6px}
.stat .d{font-size:12px;font-weight:600;margin-top:8px}
.stat .d.up{color:var(--success)}.stat .d.down{color:var(--danger)}

.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.grid-2b{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sec-title{font-weight:700;font-size:15px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}

/* 图表 */
.chart{width:100%;height:220px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-sub)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* 卡片网格（资源） */
.res-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.res-toolbar .input,.res-toolbar .select{flex:none;min-width:140px}
.res-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.res-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-sm);transition:.18s}
.res-card:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--border-strong)}
.thumb{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative}
.thumb .tag{position:absolute;top:8px;left:8px}
.res-meta{padding:11px 12px}
.res-meta .t{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-meta .s{display:flex;gap:6px;margin-top:8px}
.res-acts{display:flex;gap:6px;padding:0 12px 12px}
.res-acts .btn{flex:1;justify-content:center;padding:6px;font-size:12px}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--text-sub);font-weight:600;font-size:12px;padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .ava{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
.pager{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:14px;color:var(--text-sub);font-size:13px}

/* 首页装修列表 */
.tab-list{display:flex;flex-direction:column;gap:10px}
.tab-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 15px;box-shadow:var(--sh-sm)}
.tab-row .h{width:22px;color:var(--text-mut);font-weight:700;font-family:var(--font-display)}
.tab-row .info{flex:1}
.tab-row .info .t{font-weight:600}
.tab-row .info .sub{font-size:12px;color:var(--text-sub);margin-top:2px}
.tab-row .acts{display:flex;align-items:center;gap:8px}
.tab-row .pin{font-size:11px;font-weight:700;color:var(--primary);background:var(--primary-soft);padding:2px 8px;border-radius:999px}
.canvas-prev{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:var(--r-lg);padding:18px;min-height:340px}
.canvas-prev .ph{width:100%;height:90px;border-radius:12px;background:linear-gradient(135deg,var(--primary-soft),transparent);display:flex;align-items:center;justify-content:center;color:var(--text-sub);font-size:12px;margin-bottom:10px;border:1px solid var(--border)}
.canvas-prev .chips{display:flex;gap:8px;flex-wrap:wrap}
.canvas-prev .chip{font-size:12px;padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border)}

/* 设计说明 */
.guide h3{font-family:var(--font-display);font-size:17px;margin:18px 0 8px}
.guide p,.guide li{color:var(--text-sub);font-size:13.5px;line-height:1.7}
.guide ul{padding-left:20px;margin:6px 0}
.guide code{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:1px 7px;font-size:12.5px;color:var(--primary)}
.token-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.token{display:flex;flex-direction:column;gap:6px;align-items:center}
.token .sw{width:46px;height:46px;border-radius:12px;border:1px solid var(--border)}
.token .lb{font-size:11px;color:var(--text-sub)}

/* 占位页 */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;color:var(--text-sub);gap:10px}
.empty svg{width:46px;height:46px;opacity:.5}

@media(max-width:1100px){.stat-grid{grid-template-columns:repeat(2,1fr)}.grid-2,.grid-2b{grid-template-columns:1fr}.res-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:680px){.res-grid{grid-template-columns:repeat(2,1fr)}.topbar .search{display:none}}
</style>

function resCard(r){const [emo,type,st,ai]=r;const stb=st==='已发布'?'badge-g':st==='待审核'?'badge-y':'badge-n';const g=['linear-gradient(135deg,#fecaca,#fde68a)','linear-gradient(135deg,#bfdbfe,#a7f3d0)','linear-gradient(135deg,#ddd6fe,#fbcfe8)','linear-gradient(135deg,#bbf7d0,#a7f3d0)','linear-gradient(135deg,#fde68a,#fed7aa)'];const bg=g[(emo.charCodeAt(0))%g.length];
  return `<div class="res-card"><div class="thumb" style="background:${bg}"><span class="tag badge ${stb}">${st}</span>${emo}</div>
  <div class="res-meta"><div class="t">${type} · 示例</div><div class="s">${ai?'<span class="badge badge-b">AI</span>':''}<span class="badge badge-n">${type}</span></div></div>
  <div class="res-acts"><button class="btn btn-ghost">编辑</button><button class="btn btn-ghost">删除</button></div></div>`}
function miniStats(){return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${[['VIP5','126','badge-g'],['VIP3','540','badge-b'],['普通','47k','badge-n']].map(m=>`<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px"><div class="display" style="font-size:20px;font-weight:800">${m[1]}</div><div style="font-size:12px;color:var(--text-sub);margin-top:4px"><span class="badge ${m[2]}">${m[0]}</span></div></div>`).join('')}</div>`}
function hotList(){return `<div style="display:flex;flex-direction:column;gap:10px">${[['🌸 樱花头像','2.1k 下载'],['🏔️ 雪山壁纸','1.8k'],['✨ 星光动态框','1.5k'],['🐱 萌猫头像','1.3k'],['🌊 海浪壁纸','980']].map(h=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)"><span style="font-weight:500">${h[0]}</span><span class="badge badge-n">${h[1]}</span></div>`).join('')}</div>`}
function lineChart(){const pts=[[10,90],[40,70],[70,80],[100,55],[130,62],[160,40],[190,48],[220,30],[250,38],[280,22],[310,28],[340,16]];const mx=360,my=110;const d=pts.map((p,i)=>(i?'L':'M')+(p[0]/350*mx+10)+','+(my-p[1]/100*my+8)).join(' ');
  return `<svg class="chart" viewBox="0 0 380 130" preserveAspectRatio="none"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07c160" stop-opacity=".25"/><stop offset="1" stop-color="#07c160" stop-opacity="0"/></linearGradient></defs><path d="${d} L 350 118 L 10 118 Z" fill="url(#lg)"/><path d="${d}" fill="none" stroke="#07c160" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="${pts.map((p,i)=>(i?'L':'M')+(p[0]/350*mx+10)+','+(my-40/100*my+8)).join(' ')}" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4" opacity=".6"/></svg>`}
function pieChart(){const segs=[[46,'#07c160'],[38,'#3b82f6'],[10,'#f59e0b'],[6,'#a8a29e']];let acc=0;const cx=70,cy=70,r=58;
  const paths=segs.map(s=>{const a0=acc/100*Math.PI*2-Math.PI/2,a1=(acc+s[0])/100*Math.PI*2-Math.PI/2;acc+=s[0];const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);const big=s[0]>50?1:0;return `<path d="M${cx} ${cy} L${x0} ${y0} A${r} ${r} 0 ${big} 1 ${x1} ${y1} Z" fill="${s[1]}"/>`}).join('');
  return `<svg class="chart" viewBox="0 0 140 140" style="max-width:200px;margin:0 auto;display:block">${paths}<circle cx="${cx}" cy="${cy}" r="30" fill="var(--surface)"/></svg>`}
function emptyPage(name){return `<div class="empty">${svg(I[name]||I.dash)}<div>「${name}」模块原型建设中</div><div style="font-size:12px">设计系统已就绪，可基于此框架快速补齐</div></div>`}

/* ---------- 渲染 ---------- */
const READY=['dashboard','ops','resources','topics','hometabs','cats','daily','notifications','users','points','ads','store','share','ai','logs','admins','guide'];
function renderNav(){
  document.getElementById('nav').innerHTML = NAV.map(g=>{
    const items=g.items.map(it=>`<button class="nav-item" data-id="${it.id}" onclick="go('${it.id}')">${svg(it.icon)}<span class="l">${it.l}</span></button>`).join('');
    return `<div class="nav-group"><div class="gl">${g.g}</div>${items}</div>`;
  }).join('');
}
function renderViews(){
  document.getElementById('views').innerHTML = READY.map(id=>`<section class="view" data-view="${id}">${V[id]||emptyPage(TITLES[id]||id)}</section>`).join('');
}
function go(id){document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.id===id));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('show',v.dataset.view===id));
  document.getElementById('pageTitle').textContent=TITLES[id]||id;}
function enter(){document.getElementById('login').style.display='none';document.getElementById('app').classList.add('show');go('dashboard');}
function toggleTheme(){const h=document.documentElement;h.classList.toggle('dark');const b=document.getElementById('themeBtn');b.innerHTML=h.classList.contains('dark')?svg(I.dash):svg(I.star);}
function toggleSb(){document.getElementById('app').classList.toggle('collapsed');}

renderNav();renderViews();go('dashboard');
</script>
